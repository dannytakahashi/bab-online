name: CI/CD

# Railway deploys a push to main once these checks pass (checkSuites,
# .railway/railway.ts; Railpack, `npm start` = `node server/index.js`), so
# this workflow is the only gate in front of production. checkSuites waits
# for the whole workflow run, every job below included.
#
# Parallel since 2026-11-25: one sequential job took ~33 min (the coverage
# run alone ~17). The same checks now run as parallel jobs, the two Jest
# passes split with `--shard`, so a run takes about as long as its slowest
# shard. The final `test` job keeps one stable check name that needs every
# other job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR branch cancels the older run (main keeps every run)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Source checks, the web suite and the production boot
  checks:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        # Steps start only once mongod answers
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Same major as production: Railpack picks Node from package.json
      # engines ("26.x") before .nvmrc; keep both, this and Dockerfile.local
      # on one major (server/__tests__/nodeVersion.test.js)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The avatar pipeline (server/avatar) needs sharp's prebuilt libvips
      # (@img/sharp-linux-x64); without it the server runs with the
      # pipeline off, so fail here instead of silently in production
      - name: sharp loads (prebuilt libvips)
        run: node -e "const s=require('sharp'); console.log('sharp', s.versions.sharp, 'libvips', s.versions.vips)"

      - name: Design tokens are current
        run: npm run tokens:check

      # No UIKit / AppKit in a shared Swift file of the Apple app (iOSClient/CLAUDE.md,
      # "iOS project": the platform rules); a source check, no Xcode needed
      - name: Apple platform rule
        run: node scripts/check-apple-platform.js

      # The web and iOS sound files against sounds-src/sounds.json (plain
      # python3: the check needs no numpy or afconvert, only the rebuild does)
      - name: Sound effects are current
        run: npm run sounds:check

      - name: Client tests (Vitest)
        run: npm run test:client

      # What Railway runs: the built client, then `node server/index.js`
      # with NODE_ENV=production. Port 3000 is hard-coded (server/index.js);
      # nothing else in this job listens on it. The server writes DB_NAME, else
      # 'babonline' (never the URI's /test path), here the throwaway CI service
      - name: Production boot (node server/index.js)
        env:
          MONGO_URI: mongodb://localhost:27017/test
          NODE_ENV: production
        run: |
          npm run build:client
          node server/index.js > server-boot.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; echo "--- server log"; cat server-boot.log' EXIT
          scripts/ci-boot-check.sh --pid "$pid" \
            http://localhost:3000/health http://localhost:3000/ready http://localhost:3000/

  # The Jest suite with coverage, in 4 shards (no thresholds, so it gates like
  # plain `npm test`). REQUIRE_REAL_MONGO turns realMongo's no-mongod skip
  # into a failure. Codecov merges the shards' reports.
  jest-coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Server tests with coverage (Jest, shard ${{ matrix.shard }}/4)
        run: npm run test:coverage -- --shard=${{ matrix.shard }}/4
        env:
          MONGO_URI: mongodb://localhost:27017/test
          NODE_ENV: test
          REQUIRE_REAL_MONGO: '1'

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          fail_ci_if_error: false
          flags: shard-${{ matrix.shard }}

  # Deploy survival: the whole suite again with the live persist store on
  # (LIVE_PERSIST=write, server/game/persist/liveStore.js; no coverage), in
  # 2 shards. server/testUtils/liveTestCollections.js gives every test whose
  # database mock lacks the live getters in-memory live collections, so the
  # store writes, claims and tombstones in every game test; any change it
  # made to play would fail them
  jest-live-write:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Server tests with LIVE_PERSIST=write (Jest, shard ${{ matrix.shard }}/2)
        run: npm test -- --shard=${{ matrix.shard }}/2
        env:
          MONGO_URI: mongodb://localhost:27017/test
          NODE_ENV: test
          REQUIRE_REAL_MONGO: '1'
          LIVE_PERSIST: write

  # The race check (every pacing delay 0), plain and with the live persist
  # store writing (liveTestCollections.js, as above). The chaos, tournament
  # and contract suites already ran with it in the write-mode Jest job
  # (default seeds); `npm run test:contract` (1500 seeds, about 5 min)
  # stays a local check
  race:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        persist: ['off', 'write']

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Race check (every pacing delay 0, LIVE_PERSIST=${{ matrix.persist }})
        run: npm run test:race
        env:
          MONGO_URI: mongodb://localhost:27017/test
          NODE_ENV: test
          LIVE_PERSIST: ${{ matrix.persist }}

  build:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -f Dockerfile.local -t bab-online:${{ github.sha }} .

      # host.docker.internal doesn't resolve on Linux without --add-host;
      # host-gateway reaches the mongo service's published port
      - name: Docker image boots
        run: |
          docker run -d --name boot-check -p 3000:3000 \
            --add-host=host.docker.internal:host-gateway \
            -e NODE_ENV=production \
            -e MONGO_URI=mongodb://host.docker.internal:27017/test \
            bab-online:${{ github.sha }}
          scripts/ci-boot-check.sh --container boot-check \
            http://localhost:3000/health http://localhost:3000/ready http://localhost:3000/

      - name: Docker logs and cleanup
        if: always()
        run: |
          docker logs boot-check || true
          docker rm -f boot-check || true

  # One stable check name for the whole run: passes only when every job did
  test:
    runs-on: ubuntu-latest
    needs: [checks, jest-coverage, jest-live-write, race, build]
    if: always()
    steps:
      - name: Every CI job passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]

  # Deployment is handled automatically by Railway's GitHub integration
  # when pushing to main - no GitHub Actions deployment needed
