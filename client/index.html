<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The server's header CSP applies too (server/middleware/csp.js): a
         source must be allowed by both, so keep them in step -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        img-src 'self' data: blob:;
        connect-src 'self' ws://localhost:3000 wss://bab-online-production.up.railway.app https://bab-online-production.up.railway.app;
        font-src 'self';
        style-src 'self' 'unsafe-inline';
        media-src 'self' blob:;">

    <!-- Smart App Banner: iOS Safari (iPhone and iPad) offers the app -->
    <meta name="apple-itunes-app" content="app-id=6759510890">

    <title>BAB Online</title>
    <!-- Source page: `vite build` writes client/dist/index.html (hashed
         bundle and stylesheets), which is what Express serves. Phaser and
         socket.io-client are bundled (src/vendor.js, src/socket/createSocket.js) -->
    <!-- Design tokens first (generated: npm run tokens), the kit last -->
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/kit.css">
    <link rel="stylesheet" href="/styles/screens.css">
    <link rel="stylesheet" href="/styles/table.css">
    <link rel="stylesheet" href="/styles/gate.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- The entry decides first (phone gate, src/boot/), then imports the
         app (src/main.js); the build preloads the app chunk on non-phones -->
    <script type="module" src="/src/entry.js"></script>
</head>
<body>
    <div id="table-shell"><div id="game-container"></div></div>
</body>
</html>
