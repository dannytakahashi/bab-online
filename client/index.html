<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The server's header CSP applies too (server/middleware/csp.js): a
         source must be allowed by both, so keep them in step -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        img-src 'self' data: blob:;
        connect-src 'self' ws://localhost:3000 wss://bab-online-production.up.railway.app https://bab-online-production.up.railway.app;
        font-src 'self';
        style-src 'self' 'unsafe-inline';
        media-src 'self' blob:;">

    <!-- Smart App Banner: iOS Safari (iPhone and iPad) offers the app -->
    <meta name="apple-itunes-app" content="app-id=6759510890">

    <title>BAB Online</title>
    <!-- Source page: `vite build` writes client/dist/index.html (hashed
         bundle and stylesheets), which is what Express serves. Phaser and
         socket.io-client are bundled (src/vendor.js, src/socket/createSocket.js) -->
    <!-- Design tokens first (generated: npm run tokens), the kit last -->
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/kit.css">
    <link rel="stylesheet" href="/styles/screens.css">
    <link rel="stylesheet" href="/styles/cut.css">
    <link rel="stylesheet" href="/styles/table.css">
    <link rel="stylesheet" href="/styles/gate.css">
    <!-- Icons (scripts/build-icons.js, from the iOS app icon): a small .ico
         (16/32/48), a 192 px PNG for high-DPI tabs, the iOS home screen -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" href="/assets/icons/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <!-- The entry decides first (phone gate, src/boot/), then imports the
         app (src/main.js); the build preloads the app chunk on non-phones -->
    <script type="module" src="/src/entry.js"></script>
    <!-- The static "Couldn't load" notice (#boot-fallback): src/boot/boot.js
         hides it as soon as it runs and shows it again when the app chunk
         cannot load after one reload. Never run (the entry failed to load,
         scripts off): it shows by itself after a while. Inline, so it
         works without the stylesheets too -->
    <style>
        .boot-fallback:not([hidden]) {
            position: fixed;
            inset: 0;
            z-index: var(--z-banner);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5em;
            padding: 1em;
            font-family: var(--font-ui, system-ui, sans-serif);
            font-size: var(--type-md, 16px);
            color: var(--text-primary, inherit);
            background: var(--surface-0, transparent);
            visibility: hidden;
            animation: bab-boot-fallback 0s linear 12s forwards;
        }
        .boot-fallback.is-shown {
            visibility: visible;
            animation: none;
        }
        .boot-fallback a {
            color: var(--primary-base, inherit);
        }
        @keyframes bab-boot-fallback {
            to { visibility: visible; }
        }
    </style>
</head>
<body>
    <div id="table-shell"><div id="game-container"></div></div>
    <div id="boot-fallback" class="boot-fallback" role="alert">
        <p><strong>Couldn't load BAB Online.</strong></p>
        <p>Check your connection, then <a href="">reload the page</a>.</p>
    </div>
</body>
</html>
