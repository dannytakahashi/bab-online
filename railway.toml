[build]
builder = "NIXPACKS"

# Overrides the dashboard for each deploy (docs/claude/server-infra.md, Deploys).
[deploy]
# Restart on a non-zero exit only: a crash exits 1 (server/utils/shutdown.js),
# a deploy's SIGTERM exits 0. Same values as the dashboard setting.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# A new deploy takes traffic only once /ready answers 200 (Mongo connected
# and answering a ping); until then, or if it never does, the old one serves.
healthcheckPath = "/ready"
# Seconds. Covers connectDB's backoff on a slow Mongo (each attempt gives up
# after 5 s, then waits 2, 4, 8, 16, 30 s: 6 attempts in 120 s)
healthcheckTimeout = 120
